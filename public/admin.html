<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Vicarte Interior Concepts</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f7f4ef;
      color: #1e2d4a;
    }
    .admin-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 2px solid #b8975a;
    }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; }
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      background: white;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border-radius: 4px;
    }
    .login-container h2 {
      margin-bottom: 24px;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #e5e0d8;
      font-family: inherit;
      border-radius: 4px;
    }
    button {
      background: #1e2d4a;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 500;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    button:hover { background: #b8975a; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .stat-number {
      font-size: 48px;
      font-weight: bold;
      color: #b8975a;
      font-family: 'Cormorant Garamond', serif;
    }
    .stat-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #6b7280;
      margin-top: 8px;
    }
    .contacts-table {
      background: white;
      overflow-x: auto;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid #e5e0d8;
    }
    th {
      background: #1e2d4a;
      color: white;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 1px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }
    .status-new { background: #fed7aa; color: #9c4221; }
    .status-read { background: #bee3f8; color: #2c5282; }
    .logout-btn {
      background: #dc2626;
      padding: 8px 16px;
      width: auto;
    }
    .logout-btn:hover { background: #b91c1c; }
    .message-preview {
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-width: 768px) {
      .admin-container { padding: 20px; }
      th, td { padding: 8px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const ADMIN_SECRET = localStorage.getItem('adminToken');
    
    if (!ADMIN_SECRET) {
      renderLogin();
    } else {
      loadAdminPanel();
    }
    
    function renderLogin() {
      document.getElementById('app').innerHTML = `
        <div class="login-container">
          <h2>Admin Login</h2>
          <p style="color:#666; margin-bottom:20px; font-size:14px;">Enter your admin key to access the dashboard</p>
          <input type="password" id="adminKey" placeholder="Enter Admin Key" />
          <button onclick="login()">Access Panel</button>
        </div>
      `;
    }
    
    window.login = async () => {
      const key = document.getElementById('adminKey').value;
      if (key) {
        localStorage.setItem('adminToken', key);
        loadAdminPanel();
      } else {
        alert('Please enter admin key');
      }
    };
    
    window.logout = () => {
      localStorage.removeItem('adminToken');
      renderLogin();
    };
    
    async function loadAdminPanel() {
      const adminKey = localStorage.getItem('adminToken');
      
      try {
        const contactsRes = await fetch('/api/contact/all', {
          headers: { 'admin-key': adminKey }
        });
        
        if (!contactsRes.ok) throw new Error('Unauthorized');
        
        const contacts = await contactsRes.json();
        
        const newCount = contacts.filter(c => c.status === 'new').length;
        
        document.getElementById('app').innerHTML = `
          <div class="admin-container">
            <div class="admin-header">
              <h1>Vicarte Admin Panel</h1>
              <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
            
            <div class="stats-grid">
              <div class="stat-card">
                <div class="stat-number">${contacts.length}</div>
                <div class="stat-label">Total Inquiries</div>
              </div>
              <div class="stat-card">
                <div class="stat-number">${newCount}</div>
                <div class="stat-label">New Messages</div>
              </div>
              <div class="stat-card">
                <div class="stat-number">8+</div>
                <div class="stat-label">Years Active</div>
              </div>
            </div>
            
            <h2 style="margin: 40px 0 20px; font-weight:300;">Contact Inquiries</h2>
            <div class="contacts-table">
              <table>
                <thead>
                  <tr><th>Date</th><th>Name</th><th>Email</th><th>Service</th><th>Message</th><th>Status</th></tr>
                </thead>
                <tbody>
                  ${contacts.map(contact => `
                    <tr>
                      <td>${new Date(contact.createdAt).toLocaleDateString()}</td>
                      <td>${contact.firstName} ${contact.lastName}</td>
                      <td>${contact.email}</td>
                      <td>${contact.service || 'General'}</td>
                      <td class="message-preview" title="${contact.message}">${contact.message.substring(0, 50)}${contact.message.length > 50 ? '...' : ''}</td>
                      <td><span class="status-badge status-${contact.status}">${contact.status}</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
            ${contacts.length === 0 ? '<p style="text-align:center; padding:40px; color:#999;">No inquiries yet</p>' : ''}
          </div>
        `;
      } catch (error) {
        console.error(error);
        localStorage.removeItem('adminToken');
        renderLogin();
      }
    }
  </script>
</body>
</html>
